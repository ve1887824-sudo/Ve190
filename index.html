<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRAM Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --bg-main: #0B0E14;
            --bg-card: #151A25;
            --bg-card-hover: #1C2230;
            --text-main: #FFFFFF;
            --text-muted: #8B94A6;
            --accent-blue: #00D1FF;
            --accent-purple: #9D50FF;
            --accent-green: #00E676;
            --accent-red: #FF5252;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
            user-select: none; -webkit-user-select: none;
        }

        /* Экраны */
        .screen { display: none; flex-direction: column; height: 100%; overflow-y: auto; padding-bottom: 80px; }
        .screen.active { display: flex; }

        /* Шапка */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(21, 26, 37, 0.8);
            backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 10;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
        .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #00D1FF, #0055FF); border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 16px;}
        .balance-pill {
            display: flex; align-items: center; gap: 8px; background: var(--bg-card);
            padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(0, 209, 255, 0.3);
            font-weight: 600; font-size: 14px; color: var(--accent-blue);
        }

        /* Главная (Кликер) */
        .clicker-area { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; margin-top: 20px;}
        .huge-balance { font-size: 56px; font-weight: 700; color: var(--accent-blue); text-shadow: 0 0 20px rgba(0, 209, 255, 0.4); margin-bottom: 10px;}
        .click-btn {
            font-size: 150px; background: none; border: none; cursor: pointer;
            transition: transform 0.05s; outline: none;
            filter: drop-shadow(0 0 30px rgba(0, 209, 255, 0.3));
        }
        .click-btn:active { transform: scale(0.9); }
        .upgrade-btn {
            margin: 20px; padding: 16px; background: var(--bg-card); border: 1px solid var(--accent-purple);
            border-radius: 16px; color: white; font-weight: 600; font-size: 16px; cursor: pointer;
            display: flex; justify-content: center; gap: 10px;
        }
        .upgrade-btn:disabled { opacity: 0.5; border-color: var(--text-muted); }

        /* Профиль */
        .profile-header { display: flex; align-items: center; gap: 10px; padding: 20px; font-size: 20px; font-weight: 600; }
        .back-btn { background: var(--bg-card); border: none; color: white; width: 36px; height: 36px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;}
        
        .user-card {
            background: var(--bg-card); border-radius: 24px; margin: 0 20px; padding: 20px;
            display: flex; align-items: center; gap: 15px; border: 1px solid rgba(255,255,255,0.05);
        }
        .avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-blue); }
        .user-info h3 { font-size: 18px; margin-bottom: 4px; }
        .user-info p { font-size: 13px; color: var(--text-muted); }

        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            margin: 20px; 
        }
        .stat-box {
            background: var(--bg-card); border-radius: 16px; padding: 15px 10px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .stat-value { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;}
        .c-blue { color: var(--accent-blue); } .c-green { color: var(--accent-green); } .c-red { color: var(--accent-red); } .c-yellow { color: #FFD700; } .c-purple { color: var(--accent-purple); }

        .details-list { margin: 0 20px; background: var(--bg-card); border-radius: 24px; padding: 20px; }
        .detail-row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .detail-row:last-child { border-bottom: none; }
        .detail-row span:first-child { color: var(--text-muted); }
        .detail-row span:last-child { font-weight: 500; }

        .badges { display: flex; gap: 8px; }
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; }
        .badge-active { background: rgba(0, 230, 118, 0.2); color: var(--accent-green); }
        .badge-admin { background: rgba(0, 209, 255, 0.2); color: var(--accent-blue); }

        .action-buttons { display: flex; gap: 10px; margin: 20px; }
        .action-btn {
            flex: 1; padding: 16px; border-radius: 16px; background: var(--bg-card); border: none;
            color: white; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .admin-panel-btn {
            margin: 0 20px; padding: 16px; background: linear-gradient(135deg, #9D50FF, #6B2BFF);
            border-radius: 16px; border: none; color: white; font-weight: 600; font-size: 16px;
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 4px 20px rgba(157, 80, 255, 0.3);
        }
        .logout-btn {
            margin: 15px 20px; padding: 16px; background: transparent; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; color: var(--text-muted); font-weight: 600; font-size: 16px; cursor: pointer;
        }

        /* Навигация */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 70px; background: rgba(11, 14, 20, 0.95);
            backdrop-filter: blur(10px); border-top: 1px solid rgba(255,255,255,0.05);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            font-size: 10px; font-weight: 500; gap: 4px;
        }
        .nav-item.active { color: var(--accent-blue); }
        .nav-icon { font-size: 22px; }

        /* Скрытие элементов */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ================= ГЛАВНЫЙ ЭКРАН ================= -->
    <div class="screen active" id="screen-main">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">💎</div> GRAM CASINO
            </div>
            <div class="balance-pill">💎 <span id="balance-header">0</span> GRAM</div>
        </div>

        <div class="clicker-area">
            <div class="huge-balance"><span id="balance-main">0</span></div>
            <div style="color: var(--text-muted); font-size: 12px; letter-spacing: 2px; margin-bottom: 30px;">GRAM</div>
            
            <button class="click-btn" id="coin-btn">🐱</button>

            <button class="upgrade-btn" id="upgrade-btn" disabled>
                <span>⚡ Улучшить клик</span>
                <span id="upgrade-cost">15 💎</span>
            </button>
        </div>
    </div>

    <!-- ================= ЭКРАН ПРОФИЛЯ ================= -->
    <div class="screen" id="screen-profile">
        <div class="profile-header">
            <button class="back-btn" onclick="switchScreen('screen-main')">‹</button>
            <span>Профиль</span>
        </div>

        <div class="user-card">
            <img src="" id="user-avatar" class="avatar" alt="Avatar">
            <div class="user-info">
                <h3 id="user-name">Игрок</h3>
                <p>@<span id="user-username">username</span> • ID: <span id="user-id">0</span></p>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value c-blue" id="stat-balance">0</div>
                <div class="stat-label">GRAM</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="stat-games">0</div>
                <div class="stat-label">Игр</div>
            </div>
            <div class="stat-box">
                <div class="stat-value c-green" id="stat-wins">0</div>
                <div class="stat-label">Побед</div>
            </div>
            <div class="stat-box">
                <div class="stat-value c-red" id="stat-losses">0</div>
                <div class="stat-label">Поражений</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="stat-bonus">0</div>
                <div class="stat-label">Бонусов</div>
            </div>
            <div class="stat-box">
                <div class="stat-value c-yellow">#9</div>
                <div class="stat-label">Рейтинг</div>
            </div>
        </div>

        <div class="details-list">
            <div class="detail-row">
                <span>Баланс</span>
                <span class="c-blue" id="detail-balance">0 GRAM</span>
            </div>
            <div class="detail-row">
                <span>Telegram ID</span>
                <span id="detail-id">0</span>
            </div>
            <div class="detail-row">
                <span>Дата регистрации</span>
                <span id="detail-date">7 ноября 2026 г.</span>
            </div>
            <div class="detail-row">
                <span>Статус</span>
                <div class="badges">
                    <span class="badge badge-active">АКТИВЕН</span>
                    <!-- Бейдж Админа показываем только если ID совпадает -->
                    <span class="badge badge-admin hidden" id="admin-badge">АДМИН</span>
                </div>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn">💸 Перевод</button>
            <button class="action-btn">🏆 Рейтинг</button>
        </div>

        <!-- Кнопка админки (скрыта по умолчанию) -->
        <button class="admin-panel-btn hidden" id="admin-btn">🛡️ Админ-панель</button>
        <button class="logout-btn" onclick="switchScreen('screen-main')">Выйти</button>
    </div>

    <!-- ================= НАВИГАЦИЯ ================= -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-main" onclick="switchScreen('screen-main')">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" onclick="alert('В разработке')">
            <span class="nav-icon">🎮</span>
            <span>Игры</span>
        </button>
        <button class="nav-item" onclick="alert('В разработке')">
            <span class="nav-icon">🎁</span>
            <span>Бонус</span>
        </button>
        <button class="nav-item" id="nav-profile" onclick="switchScreen('screen-profile')">
            <span class="nav-icon">👤</span>
            <span>Профиль</span>
        </button>
        <button class="nav-item" onclick="alert('В разработке')">
            <span class="nav-icon">🏆</span>
            <span>Рейтинг</span>
        </button>
    </nav>

    <script>
        const API_URL = 'https://ve190-9.onrender.com'; 
        // ВАШ TELEGRAM ID (чтобы показать кнопку Админа). Узнать можно у бота @userinfobot
        const ADMIN_ID = "5372048108"; 

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        let coins = 0;
        let clickPower = 1;
        let costClick = 15;
        let pendingCoins = 0;
        let pendingUpgrade = false;
        let syncTimer = null;
        let userData = null;

        // Переключение экранов
        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            // Подсветка вкладок
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if (screenId === 'screen-main') document.getElementById('nav-main').classList.add('active');
            if (screenId === 'screen-profile') document.getElementById('nav-profile').classList.add('active');
        }

        function updateUI() {
            // Обновляем цифры везде
            document.getElementById('balance-header').innerText = coins;
            document.getElementById('balance-main').innerText = coins;
            document.getElementById('stat-balance').innerText = coins;
            document.getElementById('detail-balance').innerText = coins + ' GRAM';
            
            const btn = document.getElementById('upgrade-btn');
            document.getElementById('upgrade-cost').innerText = costClick + ' 💎';
            btn.disabled = coins < costClick;
        }

        async function fetchWithTimeout(url, options, timeout = 5000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                return response;
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        async function loadProgress() {
            if (!tg?.initData) return;

            try {
                const r = await fetchWithTimeout(`${API_URL}/api/load`, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                }, 5000);
                
                userData = await r.json();
                coins = userData.coins ?? 0;
                clickPower = userData.clickPower ?? 1;
                costClick = 15 * clickPower;

                // Заполняем профиль
                document.getElementById('user-name').innerText = userData.username || "Игрок";
                document.getElementById('user-username').innerText = userData.username || "username";
                document.getElementById('user-id').innerText = userData.user_id;
                document.getElementById('detail-id').innerText = userData.user_id;
                
                if (userData.photo_url) {
                    document.getElementById('user-avatar').src = userData.photo_url;
                } else {
                    // Заглушка, если нет аватарки
                    document.getElementById('user-avatar').src = "https://ui-avatars.com/api/?name=" + (userData.username || "U") + "&background=00D1FF&color=fff";
                }

                // Проверка на админа
                if (String(userData.user_id) === String(ADMIN_ID)) {
                    document.getElementById('admin-badge').classList.remove('hidden');
                    document.getElementById('admin-btn').classList.remove('hidden');
                }

            } catch(e) { 
                console.warn('Сервер спит', e);
            }
            updateUI();
        }

        async function sync() {
            if (!tg?.initData) return;
            if (pendingCoins === 0 && !pendingUpgrade) return;

            const add = pendingCoins;
            const upg = pendingUpgrade;
            pendingCoins = 0;
            pendingUpgrade = false;

            try {
                await fetchWithTimeout(`${API_URL}/api/sync`, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ initData: tg.initData, addCoins: add, upgradePower: upg })
                }, 5000);
            } catch(e) {
                pendingCoins += add;
                pendingUpgrade = pendingUpgrade || upg;
            }
        }

        function scheduleSync() {
            clearTimeout(syncTimer);
            syncTimer = setTimeout(sync, 1000);
        }

        // Клик
        document.getElementById('coin-btn').addEventListener('click', () => {
            coins += clickPower;
            pendingCoins += clickPower;
            updateUI();
            scheduleSync();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        // Апгрейд
        document.getElementById('upgrade-btn').addEventListener('click', () => {
            if (coins >= costClick) {
                coins -= costClick;
                clickPower += 1;
                costClick = 15 * clickPower;
                pendingCoins -= costClick;
                pendingUpgrade = true;
                updateUI();
                scheduleSync();
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
        });

        // Фоновое обновление (защита от откатов)
        setInterval(async () => {
            if (!tg?.initData || pendingCoins !== 0 || pendingUpgrade) return;
            try {
                const r = await fetchWithTimeout(`${API_URL}/api/load`, {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ initData: tg.initData })
                }, 5000);
                const d = await r.json();
                if (d.coins !== undefined && d.coins > coins) {
                    coins = d.coins;
                    clickPower = d.clickPower;
                    costClick = 15 * clickPower;
                    updateUI();
                }
            } catch(e) {}
        }, 10000);

        loadProgress();
    </script>
</body>
</html>
