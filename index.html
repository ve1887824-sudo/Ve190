<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KisaGame - Финал</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <!-- Подключаем библиотеку Supabase через CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(circle, #1e1b4b, #0f172a);
            color: #ffffff;
            margin: 0; padding: 20px; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            min-height: 85vh; user-select: none; -webkit-user-select: none;
        }
        .score-container { font-size: 52px; font-weight: bold; color: #f1c40f; margin-top: 10px; text-shadow: 0 0 15px rgba(241, 196, 15, 0.5); }
        .clicker-box { position: relative; margin: 40px 0; }
        .click-btn { font-size: 130px; background: none; border: none; cursor: pointer; transition: transform 0.05s; outline: none; -webkit-tap-highlight-color: transparent; }
        .click-btn:active { transform: scale(0.85); }
        .panel { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 16px; width: 100%; max-width: 320px; margin-bottom: 10px; }
        .btn-upgrade {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white;
            border: none; padding: 12px; font-size: 14px; border-radius: 10px;
            width: 100%; font-weight: bold; cursor: pointer; margin-top: 8px;
        }
        .btn-upgrade:disabled { background: #475569; opacity: 0.4; cursor: not-allowed; }
        .status { font-size: 12px; color: #94a3b8; margin-top: 5px; font-weight: 500; }
    </style>
</head>
<body>

    <div>
        <h2 id="user-greeting">KisaGame — Профиль</h2>
        <div class="score-container" id="score">0 🐾</div>
        <div class="status" id="db-status">Подключение к системе аккаунтов...</div>
    </div>

    <div class="clicker-box">
        <button class="click-btn" id="coin-btn">🐱</button>
    </div>

    <div class="panel">
        <button class="btn-upgrade" id="upgrade-click" disabled>⚔️ Сила клика (Цена: 15 🐾)</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        // Ваша база данных
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_GtVnaoI6QiSyj8U9X4UWdw_cx29rxUf";
        
        // Сверхнадежное подключение к библиотеке
        let supabase = null;
        try {
            if (typeof supabasejs !== 'undefined') {
                supabase = supabasejs.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.error("Ошибка инициализации клиента:", e);
        }

        // Переменные игрока
        let userId = "guest_test_id"; 
        let coins = 0;
        let clickPower = 1;
        let costClick = 15;

        const scoreEl = document.getElementById('score');
        const btnClick = document.getElementById('upgrade-click');
        const dbStatusEl = document.getElementById('db-status');
        const greetingEl = document.getElementById('user-greeting');

        if (tg && tg.initDataUnsafe?.user) {
            userId = tg.initDataUnsafe.user.id.toString();
            greetingEl.innerText = `Игрок: ${tg.initDataUnsafe.user.first_name}`;
        }

        // Загрузка аккаунта
        async function initAccount() {
            if (!supabase) {
                dbStatusEl.innerText = "Ошибка конфигурации базы. ❌";
                return;
            }

            try {
                let { data, error } = await supabase.from('Kis').select('*').eq('tg_id', userId).maybeSingle();

                if (error) {
                    dbStatusEl.innerText = "Ошибка сети при загрузке. ❌";
                    return;
                }

                if (data) {
                    coins = parseInt(data.coins) || 0;
                    clickPower = parseInt(data.click_power) || 1;
                    costClick = 15 * clickPower;
                    dbStatusEl.innerText = "Профиль успешно загружен! ✅";
                } else {
                    dbStatusEl.innerText = "Создаем профиль в базе данных...";
                    let { error: insertError } = await supabase.from('Kis').insert([{ tg_id: userId, coins: 0, click_power: 1 }]);
                    if (!insertError) {
                        dbStatusEl.innerText = "Новый аккаунт успешно создан! 🎉";
                    } else {
                        dbStatusEl.innerText = "Ошибка создания аккаунта. ❌";
                    }
                }
            } catch (err) {
                dbStatusEl.innerText = "Ошибка базы данных. ❌";
            }
            updateUI();
        }

        // Сохранение баланса
        async function saveBalance() {
            if (supabase) {
                try {
                    await supabase.from('Kis').update({ coins: coins, click_power: clickPower }).eq('tg_id', userId);
                } catch (e) {
                    console.error("Ошибка сохранения баланса:", e);
                }
            }
        }

        // Клик
        document.getElementById('coin-btn').addEventListener('click', () => {
            coins += clickPower;
            updateUI();
            saveBalance();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        // Прокачка
        btnClick.addEventListener('click', () => {
            if (coins >= costClick) {
                coins -= costClick;
                clickPower += 1;
                costClick = 15 * clickPower;
                updateUI();
                saveBalance();
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
        });

        function updateUI() {
            scoreEl.innerText = coins + ' 🐾';
            btnClick.innerText = `⚔️ Сила клика (+1) — ${costClick} 🐾`;
            btnClick.disabled = coins < costClick;
        }

        // Старт системы
        initAccount();
    </script>
</body>
</html>
