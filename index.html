<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KisaGame RPG</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ГЛАВНАЯ -->
    <div class="screen active" id="screen-main">
        <div class="header">
            <div class="logo">
                <div class="logo-icon">🐾</div>
                <div><div style="font-size:14px; font-weight:800; letter-spacing:1px; line-height:1;">KISA</div><div style="font-size:10px; color:var(--accent-blue); letter-spacing:2px;">RPG</div></div>
            </div>
            <div class="header-right">
                <div class="balance-pill">🐾 <span id="balance-header">0</span></div>
            </div>
        </div>

        <div class="main-content">
            <div class="profile-card" style="background: linear-gradient(135deg, #4c1d95, #0B0E14); border: 1px solid #7c3aed;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="font-size: 12px; color: #d8b4fe; margin-bottom: 5px;">УРОВЕНЬ <span id="main-level">1</span></div>
                        <div class="huge-balance" style="font-size: 28px; font-weight: 800; color: #f3e8ff;">Герой</div>
                    </div>
                    <div style="font-size: 40px; filter: drop-shadow(0 0 10px #a855f7);">🧙‍♂️</div>
                </div>
                <div style="margin-top: 15px;">
                    <div style="display:flex; justify-content:space-between; font-size: 10px; color: var(--text-muted); margin-bottom: 5px;">
                        <span>XP</span>
                        <span><span id="main-xp">0</span> / <span id="main-max-xp">100</span></span>
                    </div>
                    <div class="progress-bar" style="height: 8px;"><div class="progress-fill" id="xp-fill" style="width: 0%; background: #a855f7;"></div></div>
                </div>
            </div>

            <div class="section-title">Испытания</div>
            
            <div class="game-grid-main">
                <div class="game-card-main full-width" onclick="openRPG()" style="background: linear-gradient(90deg, #4c1d95, #0f172a); border: 1px solid #7c3aed;">
                    <div class="game-card-icon">⚔️</div>
                    <div class="game-card-info">
                        <div class="game-card-title">Карта Подземелья</div>
                        <div class="game-card-desc">Исследуй локации и сражайся с боссами</div>
                    </div>
                    <div class="game-badge purple">RPG</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ЭКРАН RPG -->
    <div class="screen" id="screen-rpg">
        <div class="header" style="justify-content: flex-start; gap: 15px; background: transparent;">
            <button class="back-btn" onclick="switchScreen('screen-main')">‹</button>
            <div class="logo">
                <div class="logo-icon" style="font-size: 20px; background: #7c3aed;">⚔️</div>
                <div><div style="font-size:16px; font-weight:700;">Подземелье</div><div style="font-size:10px; color:var(--text-muted);" id="rpg-hp-text">HP: 100/100</div></div>
            </div>
        </div>
        
        <div class="game-play-area" id="rpg-area">
            <!-- Карта или бой -->
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-main" onclick="switchScreen('screen-main')"><span class="nav-icon">🏠</span><span>Главная</span></button>
        <button class="nav-item" onclick="openRPG()"><span class="nav-icon">⚔️</span><span>Подземелье</span></button>
        <button class="nav-item" onclick="alert('В разработке')"><span class="nav-icon">👤</span><span>Профиль</span></button>
        <button class="nav-item" onclick="alert('В разработке')"><span class="nav-icon">🏆</span><span>Рейтинг</span></button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
