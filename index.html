<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KisaGame Pro Tabs</title>
    <!-- Скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Базовые цвета (Тёмная тема) */
        :root {
            --bg-color: radial-gradient(circle, #1e1b4b, #0f172a);
            --text-color: #ffffff;
            --panel-bg: rgba(255, 255, 255, 0.05);
            --accent-color: #3b82f6;
        }
        
        /* Светлая тема */
        .theme-light {
            --bg-color: linear-gradient(135deg, #f3f4f6, #e5e7eb);
            --text-color: #1f2937;
            --panel-bg: rgba(0, 0, 0, 0.05);
            --accent-color: #2563eb;
        }
        
        /* Космическая тема */
        .theme-cosmic {
            --bg-color: radial-gradient(circle, #581c87, #111827);
            --text-color: #fae8ff;
            --panel-bg: rgba(232, 121, 249, 0.1);
            --accent-color: #a855f7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; user-select: none; -webkit-user-select: none;
            box-sizing: border-box;
        }

        /* Окна экранов */
        .screen {
            display: none; width: 100%; max-width: 360px;
            flex-direction: column; align-items: center;
            justify-content: space-between; height: calc(100vh - 70px);
            padding: 20px; box-sizing: border-box;
        }
        
        .screen.active { display: flex; }

        /* Элементы кликера */
        .score-container { font-size: 52px; font-weight: bold; color: #f1c40f; margin-top: 20px; text-shadow: 0 0 15px rgba(241, 196, 15, 0.5); }
        .clicker-box { position: relative; margin: auto 0; }
        .click-btn { font-size: 130px; background: none; border: none; cursor: pointer; transition: transform 0.05s; outline: none; -webkit-tap-highlight-color: transparent; }
        .click-btn:active { transform: scale(0.85); }
        .panel { background: var(--panel-bg); padding: 15px; border-radius: 16px; width: 100%; box-sizing: border-box; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        
        /* Кнопки */
        .btn-general {
            background: linear-gradient(135deg, var(--accent-color), #1d4ed8); color: white;
            border: none; padding: 14px; font-size: 15px; border-radius: 12px;
            width: 100%; font-weight: bold; cursor: pointer;
        }
        .btn-general:disabled { background: #475569; opacity: 0.4; cursor: not-allowed; }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #b91c1c); color: white;
            border: none; padding: 14px; font-size: 15px; border-radius: 12px;
            width: 100%; font-weight: bold; cursor: pointer; margin-top: 15px;
        }

        /* Выбор темы */
        .theme-selector { display: flex; gap: 10px; width: 100%; margin-top: 15px; }
        .btn-theme {
            flex: 1; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            background: var(--panel-bg); color: var(--text-color); cursor: pointer; font-weight: 500;
        }

        /* Нижние вкладки */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: 65px; background: var(--panel-bg);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.08); z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            background: none; border: none; color: #94a3b8; cursor: pointer;
            font-size: 12px; font-weight: 500;
        }
        .nav-item.active { color: #f1c40f; }
        .nav-icon { font-size: 24px; margin-bottom: 2px; }
    </style>
</head>
<body id="app-body">

    <!-- ЭКРАН 1: КЛИКЕР -->
    <div class="screen active" id="screen-main">
        <div>
            <h2>KisaGame</h2>
            <div class="score-container" id="score">0 🐾</div>
        </div>

        <div class="clicker-box">
            <button class="click-btn" id="coin-btn">🐱</button>
        </div>

        <div class="panel">
            <button class="btn-general" id="upgrade-click" disabled>⚔️ Сила клика (Цена: 15 🐾)</button>
        </div>
    </div>

    <!-- ЭКРАН 2: НАСТРОЙКИ -->
    <div class="screen" id="screen-settings">
        <div style="width: 100%;">
            <h2>Настройки</h2>
            
            <div class="panel">
                <div style="text-align: left; font-size: 14px; margin-bottom: 5px; opacity: 0.8;">Тема оформления:</div>
                <div class="theme-selector">
                    <button class="btn-theme" onclick="changeTheme('dark')">🌌 Тёмная</button>
                    <button class="btn-theme" onclick="changeTheme('light')">☀️ Светлая</button>
                    <button class="btn-theme" onclick="changeTheme('cosmic')">🔮 Космос</button>
                </div>
            </div>

            <div class="panel" style="margin-top: 20px;">
                <div style="text-align: left; font-size: 14px; opacity: 0.8;">Опасная зона:</div>
                <button class="btn-danger" id="reset-btn">🔄 Сбросить весь прогресс</button>
            </div>
        </div>
        
        <div style="font-size: 12px; opacity: 0.4; margin-bottom: 20px;">KisaGame v2.0 • Сервер</div>
    </div>

    <!-- МЕНЮ ВКЛАДОК СНИЗУ -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-main">
            <span class="nav-icon">🎮</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" id="nav-settings">
            <span class="nav-icon">⚙️</span>
            <span>Настройки</span>
        </button>
    </nav>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        // Загрузка памяти и дефолтных настроек
        let coins = parseInt(localStorage.getItem('kisa_coins')) || 0;
        let clickPower = parseInt(localStorage.getItem('kisa_power')) || 1;
        let costClick = 15 * clickPower;
        let currentTheme = localStorage.getItem('kisa_theme') || 'dark';

        const scoreEl = document.getElementById('score');
        const btnClick = document.getElementById('upgrade-click');
        const bodyEl = document.getElementById('app-body');

        // Элементы вкладок
        const navMain = document.getElementById('nav-main');
        const navSettings = document.getElementById('nav-settings');
        const screenMain = document.getElementById('screen-main');
        const screenSettings = document.getElementById('screen-settings');

        // Переключение на Главную
        navMain.addEventListener('click', () => {
            navMain.classList.add('active');
            navSettings.classList.remove('active');
            screenMain.classList.add('active');
            screenSettings.classList.remove('active');
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        // Переключение на Настройки
        navSettings.addEventListener('click', () => {
            navSettings.classList.add('active');
            navMain.classList.remove('active');
            screenSettings.classList.add('active');
            screenMain.classList.remove('active');
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        // Функция изменения тем
        function changeTheme(themeName) {
            currentTheme = themeName;
            localStorage.setItem('kisa_theme', themeName);
            
            bodyEl.className = ''; 
            if (themeName === 'light') bodyEl.classList.add('theme-light');
            if (themeName === 'cosmic') bodyEl.classList.add('theme-cosmic');
            
            if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        }

        // Применяем тему сразу
        changeTheme(currentTheme);

        // Функция сохранения данных
        function saveData() {
            localStorage.setItem('kisa_coins', coins);
            localStorage.setItem('kisa_power', clickPower);
            
            // Синхронизация с запущенным Python-сервером на Render
            if (tg?.sendData) {
                try {
                    tg.sendData(`${coins}|${clickPower}`);
                } catch (e) {
                    console.warn('sendData недоступен:', e);
                }
            }
        }

        // Нажатие на котика
        document.getElementById('coin-btn').addEventListener('click', () => {
            coins += clickPower;
            updateUI();
            saveData();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        // Улучшение клика
        btnClick.addEventListener('click', () => {
            if (coins >= costClick) {
                coins -= costClick;
                clickPower += 1;
                costClick = 15 * clickPower;
                updateUI();
                saveData();
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
        });

        // Полный сброс (Рестарт)
        document.getElementById('reset-btn').addEventListener('click', () => {
            if (confirm("Вы уверены, что хотите полностью сбросить весь прогресс?")) {
                coins = 0;
                clickPower = 1;
                costClick = 15;
                updateUI();
                saveData();
                changeTheme('dark'); 
                
                if (tg?.showAlert) {
                    tg.showAlert("Весь игровой прогресс обнулен! 🔄");
                } else {
                    alert("Весь игровой прогресс обнулен! 🔄");
                }
                navMain.click(); // Перекидываем обратно на кликер
            }
        });

        function updateUI() {
            scoreEl.innerText = coins + ' 🐾';
            btnClick.innerText = `⚔️ Сила клика (+1) — ${costClick} 🐾`;
            btnClick.disabled = coins < costClick;
        }
        updateUI();
    </script>
</body>
</html>
