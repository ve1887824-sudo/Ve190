<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KisaGame Server Sync</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle, #1e1b4b, #0f172a);
            color: #ffffff;
            margin: 0; padding: 20px; text-align: center;
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            min-height: 85vh; user-select: none; -webkit-user-select: none;
        }
        .score-container { font-size: 52px; font-weight: bold; color: #f1c40f; margin-top: 20px; text-shadow: 0 0 15px rgba(241, 196, 15, 0.5); }
        .clicker-box { position: relative; margin: 40px 0; }
        .click-btn { font-size: 130px; background: none; border: none; cursor: pointer; transition: transform 0.05s; outline: none; }
        .click-btn:active { transform: scale(0.85); }
        .panel { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 16px; width: 100%; max-width: 320px; margin-bottom: 20px; }
        .btn-upgrade { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; border: none; padding: 14px; font-size: 15px; border-radius: 12px; width: 100%; font-weight: bold; cursor: pointer; }
        .btn-upgrade:disabled { background: #475569; opacity: 0.4; }
        .status { font-size: 12px; color: #a8a29e; margin-top: 5px; }
    </style>
</head>
<body>

    <div>
        <h2>KisaGame Pro</h2>
        <div class="score-container" id="score">0 🐾</div>
        <div class="status">Облачная синхронизация включена</div>
    </div>

    <div class="clicker-box">
        <button class="click-btn" id="coin-btn">🐱</button>
    </div>

    <div class="panel">
        <button class="btn-upgrade" id="upgrade-click" disabled>⚔️ Сила клика (Цена: 15 🐾)</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.ready(); }

        // Берем данные из локальной памяти, но при закрытии отправим их серверу
        let coins = parseInt(localStorage.getItem('kisa_coins')) || 0;
        let clickPower = parseInt(localStorage.getItem('kisa_power')) || 1;
        let costClick = 15 * clickPower;

        const scoreEl = document.getElementById('score');
        const btnClick = document.getElementById('upgrade-click');

        function saveData() {
            localStorage.setItem('kisa_coins', coins);
            localStorage.setItem('kisa_power', clickPower);
            
            // ОТПРАВКА ДАННЫХ БОТУ (Для переноса между устройствами)
            if (tg) {
                tg.sendData(`${coins}|${clickPower}`);
            }
        }

        document.getElementById('coin-btn').addEventListener('click', () => {
            coins += clickPower;
            updateUI();
            saveData();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        });

        btnClick.addEventListener('click', () => {
            if (coins >= costClick) {
                coins -= costClick;
                clickPower += 1;
                costClick = 15 * clickPower;
                updateUI();
                saveData();
                if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
        });

        function updateUI() {
            scoreEl.innerText = coins + ' 🐾';
            btnClick.innerText = `⚔️ Сила клика (+1) — ${costClick} 🐾`;
            btnClick.disabled = coins < costClick;
        }

        updateUI();
    </script>
</body>
</html>
